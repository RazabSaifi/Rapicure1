<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#14b8a6" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Hospital Cross + ECG Pulse wave emblem -->
  <!-- Subtle Medical Cross watermark in center -->
  <rect x="226" y="110" width="60" height="292" rx="16" fill="#14b8a6" fill-opacity="0.12"/>
  <rect x="110" y="226" width="292" height="60" rx="16" fill="#14b8a6" fill-opacity="0.12"/>

  <!-- Glowing Pulse Wave path -->
  <path d="M 80 256 L 160 256 L 195 190 L 235 340 L 275 130 L 315 370 L 350 256 L 432 256"
        fill="none"
        stroke="url(#tealGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Circular radar beacon at the peak -->
  <circle cx="275" cy="130" r="16" fill="#5eead4"/>
  <circle cx="275" cy="130" r="28" fill="none" stroke="#5eead4" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Small AI Stethoscope / Caduceus star spark -->
  <path d="M 390 120 Q 390 145 415 145 Q 390 145 390 170 Q 390 145 365 145 Q 390 145 390 120 Z"
        fill="#34d399"/>
</svg>
